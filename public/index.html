<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chilaquiles El Oso</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div><b>🐻 CHILAQUILES EL OSO</b><small>Disfruta tus chilaquiles como más te gustan</small></div><button id="cartBtn">🛒 Carrito <span id="count">0</span></button></header>
<main><section class="hero"><h1>Elige tus chilaquiles</h1><p>Agrega al carrito. <strong>El pedido se paga antes de preparar.</strong></p></section><section id="products" class="grid"></section></main>
<aside id="cart" class="drawer"><div class="drawerHead"><h2>Tu pedido</h2><button onclick="closeCart()">✕</button></div><div id="cartItems"></div><div class="total"><span>Total</span><strong id="total">$0</strong></div><button class="primary" onclick="openCheckout()">Continuar y pagar</button></aside><div id="shade" onclick="closeCart()"></div>
<div id="modal" class="modal"><div class="box"><button class="x" onclick="closeModal()">✕</button><h2>Finalizar pedido</h2><div id="step1"><label>Nombre<input id="name" placeholder="Tu nombre"></label><label>WhatsApp / teléfono<input id="phone" placeholder="10 dígitos"></label><label>¿Cómo recibirás?<select id="fulfillment" onchange="toggleAddress()"><option value="PICKUP">Recoger</option><option value="DELIVERY">Entrega</option></select></label><label id="addressWrap" class="hidden">Dirección<textarea id="address" placeholder="Calle, número, colonia..."></textarea></label><label>Forma de pago<select id="payment"><option value="MERCADO_PAGO">Mercado Pago</option><option value="TRANSFERENCIA">Transferencia bancaria</option></select></label><label>Notas (opcional)<textarea id="notes" placeholder="Sin cebolla, salsa aparte..."></textarea></label><div class="notice">🔒 <b>Pago obligatorio:</b> primero pagas, después preparamos tu pedido.</div><button class="primary" onclick="createOrder()">Crear pedido y pagar</button></div><div id="step2" class="hidden"></div></div></div>
<script src="/app.js"></script></body></html>
